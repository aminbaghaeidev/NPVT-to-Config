<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NPVT Decrypter</title>
       <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M20 28V18a12 12 0 0 1 24 0' fill='none' stroke='%23F5B301' stroke-width='6' stroke-linecap='round'/%3E%3Crect x='10' y='28' width='44' height='30' rx='6' fill='%23F5B301'/%3E%3Cpath d='M35 28L28 38L37 42L29 58' fill='none' stroke='%231b1b1b' stroke-width='3' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='43' r='3.5' fill='%231b1b1b'/%3E%3C/svg%3E"/>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

      const files = [
        "app.py",
        "data/npv_tables.json",
        "src/npvt_decrypter/whitebox_aes.py",
        "src/npvt_decrypter/link_builder.py",
        "src/UI/inputs.py",
        "src/UI/processing.py",
        "src/UI/results.py",
        "src/UI/sidebar.py",
        "src/utils/data_loader.py",
        "src/utils/streamlit_cache.py"
      ];

      mount(
        {
          entrypoint: "app.py",
          files: Object.fromEntries(files.map((f) => [f, { url: "./" + f }])),
        },
        document.getElementById("root"),
      );

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
  </body>
</html>
